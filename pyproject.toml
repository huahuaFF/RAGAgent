[project]
name = "ragagent"
version = "0.1.0"
description = "Paper-oriented RAG service with FastAPI and a React frontend"
readme = "README.md"
authors = [
    { name = "unhappyh2", email = "qiuguanhua37@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "dashscope>=1.26.7",
    "dotenv>=0.9.9",
    "fastapi[standard]>=0.141.1",
    "langchain>=1.3.15",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-deepseek>=1.1.0",
    "pypdf>=6.1.1",
    "pymupdf>=1.26.0",
]

[project.scripts]
ragagent = "ragagent:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"